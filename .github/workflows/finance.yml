name: Finance daily report

on:
  schedule:
    - cron: "27 2 * * *"   # 09:27 Bangkok time
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (don't send to LINE)"
        type: boolean
        default: false

permissions:
  contents: write   # to save the chart pictures and price history

concurrency:
  group: repo-push   # never push at the same moment as another workflow run
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      FINANCE_LINE_TOKEN: ${{ secrets.FINANCE_LINE_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libraries
        run: pip install --quiet matplotlib anthropic
      - name: Build report and pictures
        run: python finance-report/send_finance.py --prepare
      - name: Save pictures to the repo (so LINE can load them)
        run: |
          git config user.name "finance-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add finance-report/charts finance-report/data
          git diff --cached --quiet || git commit -m "Finance report pictures"
          git pull --rebase --quiet
          git push
      - name: Send LINE report
        if: ${{ !inputs.dry_run }}
        run: |
          sleep 15
          python finance-report/send_finance.py --send
