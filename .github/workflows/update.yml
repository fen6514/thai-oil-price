name: Update oil prices

on:
  schedule:
    - cron: "17 23 * * *"
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview the evening LINE report only (don't send)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-push   # never push at the same moment as another workflow run
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python thai-oil-price/scripts/fetch_prices.py
      - name: Save to repo
        run: |
          git config user.name "oil-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add thai-oil-price/data/
          git diff --cached --quiet || git commit -m "Prices update"
          git pull --rebase --quiet
          git push
      - name: Send LINE report
        if: env.LINE_TOKEN != ''
        run: python thai-oil-price/scripts/send_line.py ${{ inputs.preview && '--dry-run --evening' || '' }}
