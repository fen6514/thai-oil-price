name: Update oil prices

on:
  schedule:
    - cron: "17 23 * * *"   # 06:17 Bangkok time, every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python scripts/fetch_prices.py
      - name: Save to repo
        run: |
          git config user.name "oil-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Prices for $(TZ=Asia/Bangkok date +%F)"
          git push
